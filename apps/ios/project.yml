name: Baseball
options:
  bundleIdPrefix: com.solkim.baseball
  deploymentTarget:
    iOS: "17.0"
packages:
  BaseballSimulation:
    path: ../../packages/simulation-core
targets:
  BaseballIOS:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solkim.baseball.ios
        PRODUCT_NAME: 야구 못하면 또 환생함
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 야구 못하면 또 환생함
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: BaseballSimulation
        product: SimulationCore
schemes:
  BaseballIOS:
    build:
      targets:
        BaseballIOS: all
    run:
      config: Debug
