name: ProjectDiamondSoul
options:
  bundleIdPrefix: com.diamondsoul
  deploymentTarget:
    iOS: "17.0"
packages:
  DiamondSoulSimulation:
    path: ../../packages/simulation-core
targets:
  DiamondSoulIOS:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diamondsoul.ios
        PRODUCT_NAME: Diamond Soul
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Diamond Soul
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: DiamondSoulSimulation
        product: SimulationCore
schemes:
  DiamondSoulIOS:
    build:
      targets:
        DiamondSoulIOS: all
    run:
      config: Debug
