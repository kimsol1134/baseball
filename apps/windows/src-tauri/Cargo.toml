[package]
name = "baseball"
version = "1.0.0"
description = "야구 못하면 또 환생함 desktop shell"
authors = ["야구 못하면 또 환생함"]
edition = "2021"

[lib]
name = "baseball_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
