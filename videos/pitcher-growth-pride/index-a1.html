    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #070C0A;
      }
      #aroll-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #aroll-zoom {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      #aroll-zoom video {
        width: 1080px;
        height: 1920px;
        display: block;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 게임플레이 내내 scale>=1.3 유지 (상단 HUD 볼카운트가 시나리오와 모순되지 않게 화각에서 제외)
      tl.set("#aroll-zoom", { scale: 1.36, transformOrigin: "50% 100%" }, 0);
      // F1 페이오프: 컨텍스트 → 미터 클로즈업(2.4x) → 슬로우 퍼펙트 적중 → 배지 스냅아웃
      tl.to("#aroll-zoom", { scale: 1.3, duration: 0.25, ease: "power1.out" }, 3.0);
      tl.to("#aroll-zoom", { scale: 2.4, duration: 0.32, ease: "power2.inOut" }, 3.28);
      tl.to("#aroll-zoom", { scale: 1.3, duration: 0.28, ease: "power4.out" }, 4.55);
      tl.to("#aroll-zoom", { scale: 1.38, duration: 1.43, ease: "power1.inOut" }, 4.9);
      // F2 헛스윙: 드래그 펀치인 → 배지 스냅아웃 → 푸시
      tl.set("#aroll-zoom", { scale: 1.56, transformOrigin: "50% 86%" }, 6.33);
      tl.to("#aroll-zoom", { scale: 1.46, duration: 0.75, ease: "power1.out" }, 6.35);
      tl.to("#aroll-zoom", { scale: 1.3, duration: 0.28, ease: "power4.out" }, 7.24);
      tl.to("#aroll-zoom", { scale: 1.4, duration: 2.28, ease: "power1.inOut" }, 7.60);
      // F3 엔드카드: 슬로우 줌
      tl.set("#aroll-zoom", { scale: 1.28, transformOrigin: "50% 45%" }, 9.88);
      tl.to("#aroll-zoom", { scale: 1.36, duration: 3.26, ease: "power1.inOut" }, 9.90);
      window.__timelines["main"] = tl;
    </script>
