<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=886, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 886px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      @font-face {
        font-family: "Pretendard";
        src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Pretendard";
        src: url("assets/fonts/Pretendard-Black.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Noto Sans JP";
        src: url("assets/fonts/NotoSansJP-Black.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }
      #root {
        position: relative;
        width: 886px;
        height: 1920px;
        overflow: hidden;
        background: #070c0a;
        color: #f1f4ee;
        /* 일본어 가나·한자는 Pretendard에 없어 Noto Sans JP(번들)로 폴백한다. */
        font-family: "Pretendard", "Noto Sans JP", sans-serif;
        container-type: size;
      }
      .p1-viewport { position: absolute; inset: 0; overflow: hidden; }
      .p1-zoom { position: absolute; inset: 0; will-change: transform; }
      .p1-zoom video { width: 886px; height: 1920px; display: block; }
      .p1-zoom2 { position: absolute; inset: 0; will-change: transform; }
      .p1-zoom2 img { width: 886px; height: 1920px; object-fit: cover; object-position: center 40%; display: block; }
      .p1-scrim { position: absolute; left: 0; top: 0; right: 0; height: 360px; background: linear-gradient(180deg, rgba(4, 8, 6, 0.9) 0%, rgba(4, 8, 6, 0.5) 60%, rgba(4, 8, 6, 0) 100%); }
      .p1-dim { position: absolute; inset: 0; background: rgba(4, 8, 6, 0.64); opacity: 0; }
      .p1-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
      .p1-cap { position: absolute; left: 52px; right: 52px; top: 118px; margin: 0; font-size: 56px; line-height: 1.16; font-weight: 900; letter-spacing: -0.01em; color: #f1f4ee; text-shadow: 0 4px 22px rgba(0, 0, 0, 0.55); opacity: 0; }
      .p1-endline1 { position: absolute; left: 50px; right: 50px; margin: 0; text-align: center; font-size: 82px; line-height: 1; font-weight: 900; letter-spacing: -0.02em; color: #f1f4ee; opacity: 0; }
      .p1-endline1a { top: 772px; }
      .p1-endline1b { top: 876px; }
      .p1-endline2 { position: absolute; left: 50px; right: 50px; top: 1030px; margin: 0; text-align: center; font-size: 108px; line-height: 1; font-weight: 900; letter-spacing: 0; color: #e8b24c; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="p1-journey-ja" data-start="0" data-width="886" data-height="1920" data-duration="25">
      <div class="p1-viewport">
        <div class="p1-zoom">
          <video id="p1-video-ja" class="clip" src="assets/clips/aroll-p1-ja.mp4" data-start="0" data-duration="20" data-track-index="0" muted playsinline></video>
        </div>
        <div class="p1-zoom2">
          <img id="p1-end-img-ja" class="clip" src="assets/endcard-ja.png" alt="" data-start="20" data-duration="5" data-track-index="2">
        </div>
      </div>
      <div id="p1-overlay-ja" class="clip" data-start="0" data-duration="25" data-track-index="3">
        <div class="p1-scrim"></div>
        <div class="p1-dim"></div>
        <div class="p1-flash"></div>
        <p class="p1-cap p1-cap1">3年でドラフト指名へ</p>
        <p class="p1-cap p1-cap2">自分だけの投手をつくる</p>
        <p class="p1-cap p1-cap3">初めてのマウンド</p>
        <p class="p1-cap p1-cap4">一球ずつ、自分の指で投げる</p>
        <p class="p1-cap p1-cap5">タイミングが球威になる</p>
        <p class="p1-cap p1-cap6">指先で三振を奪う</p>
        <p class="p1-cap p1-cap7">ここから、3年間の勝負</p>
        <h1 class="p1-endline1 p1-endline1a">野球がダメなら</h1>
        <h1 class="p1-endline1 p1-endline1b">また転生</h1>
        <p class="p1-endline2">投手育成</p>
      </div>
      <!-- SFX -->
      <audio id="p1-sfx-ja-0" src="assets/sfx/whoosh-short.mp3" data-start="0.05" data-duration="0.57" data-track-index="20" data-volume="0.3"></audio>
      <audio id="p1-sfx-ja-1" src="assets/sfx/whoosh-short.mp3" data-start="2.75" data-duration="0.57" data-track-index="21" data-volume="0.26"></audio>
      <audio id="p1-sfx-ja-2" src="assets/sfx/whoosh-short.mp3" data-start="5.75" data-duration="0.57" data-track-index="22" data-volume="0.26"></audio>
      <audio id="p1-sfx-ja-3" src="assets/sfx/whoosh.mp3" data-start="7.75" data-duration="0.57" data-track-index="23" data-volume="0.3"></audio>
      <audio id="p1-sfx-ja-4" src="assets/sfx/impact-bass-1.mp3" data-start="8.9" data-duration="2.12" data-track-index="24" data-volume="0.4"></audio>
      <audio id="p1-sfx-ja-5" src="assets/sfx/whoosh-short.mp3" data-start="10.25" data-duration="0.57" data-track-index="25" data-volume="0.26"></audio>
      <audio id="p1-sfx-ja-6" src="assets/sfx/ping.mp3" data-start="11.12" data-duration="1.32" data-track-index="26" data-volume="0.35"></audio>
      <audio id="p1-sfx-ja-7" src="assets/sfx/riser.mp3" data-start="13.1" data-duration="2.6" data-track-index="27" data-volume="0.16"></audio>
      <audio id="p1-sfx-ja-8" src="assets/sfx/impact-bass-1.mp3" data-start="14.0" data-duration="2.12" data-track-index="28" data-volume="0.45"></audio>
      <audio id="p1-sfx-ja-9" src="assets/sfx/whoosh-short.mp3" data-start="16.7" data-duration="0.57" data-track-index="29" data-volume="0.24"></audio>
      <audio id="p1-sfx-ja-10" src="assets/sfx/impact-bass-1.mp3" data-start="20.05" data-duration="2.12" data-track-index="30" data-volume="0.36"></audio>
      <audio id="p1-sfx-ja-11" src="assets/sfx/chime.mp3" data-start="20.5" data-duration="2.5" data-track-index="31" data-volume="0.26"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // journey push-ins
      tl.fromTo(".p1-zoom", { scale: 1.02, transformOrigin: "50% 40%" }, { scale: 1.06, duration: 2.7, ease: "power1.inOut" }, 0);
      tl.set(".p1-zoom", { scale: 1.02 }, 2.7);
      tl.to(".p1-zoom", { scale: 1.06, duration: 3.0, ease: "power1.inOut" }, 2.72);
      tl.set(".p1-zoom", { scale: 1.03 }, 5.7);
      tl.to(".p1-zoom", { scale: 1.07, duration: 2.0, ease: "power1.inOut" }, 5.72);
      // pitch 1: looking strike (7.7-10.2, badge 8.95)
      tl.set(".p1-zoom", { scale: 1.24, transformOrigin: "50% 86%" }, 7.7);
      tl.to(".p1-zoom", { scale: 1.18, duration: 1.1, ease: "power1.out" }, 7.72);
      tl.to(".p1-zoom", { scale: 1.0, duration: 0.28, ease: "power4.out" }, 8.88);
      tl.to(".p1-zoom", { scale: 1.04, duration: 0.95, ease: "power1.inOut" }, 9.2);
      // pitch 2: foul (10.2-13.1, badge 11.16)
      tl.set(".p1-zoom", { scale: 1.24 }, 10.2);
      tl.to(".p1-zoom", { scale: 1.18, duration: 0.85, ease: "power1.out" }, 10.22);
      tl.to(".p1-zoom", { scale: 1.0, duration: 0.28, ease: "power4.out" }, 11.1);
      tl.to(".p1-zoom", { scale: 1.04, duration: 1.6, ease: "power1.inOut" }, 11.45);
      // pitch 3: whiff (13.1-16.67, badge 14.05)
      tl.set(".p1-zoom", { scale: 1.26 }, 13.1);
      tl.to(".p1-zoom", { scale: 1.2, duration: 0.85, ease: "power1.out" }, 13.12);
      tl.to(".p1-zoom", { scale: 1.0, duration: 0.28, ease: "power4.out" }, 14.02);
      tl.to(".p1-zoom", { scale: 1.05, duration: 2.25, ease: "power1.inOut" }, 14.38);
      // inning end (16.67-20)
      tl.set(".p1-zoom", { scale: 1.02, transformOrigin: "50% 45%" }, 16.67);
      tl.to(".p1-zoom", { scale: 1.08, duration: 3.3, ease: "power1.inOut" }, 16.69);
      // endcard still
      tl.fromTo(".p1-zoom2", { scale: 1.04, transformOrigin: "50% 40%" }, { scale: 1.12, duration: 5, ease: "power1.inOut" }, 20);
      // flashes at badges
      tl.fromTo(".p1-flash", { opacity: 0 }, { opacity: 0.28, duration: 0.07, ease: "power1.in" }, 8.88);
      tl.to(".p1-flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, 8.97);
      tl.to(".p1-flash", { opacity: 0.28, duration: 0.07, ease: "power1.in" }, 11.1);
      tl.to(".p1-flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, 11.19);
      tl.to(".p1-flash", { opacity: 0.32, duration: 0.07, ease: "power1.in" }, 14.0);
      tl.to(".p1-flash", { opacity: 0, duration: 0.24, ease: "power2.out" }, 14.09);
      // captions (one visible at a time)
      const caps = [
        [".p1-cap1", 0.4, 2.5],
        [".p1-cap2", 2.9, 5.5],
        [".p1-cap3", 5.9, 7.5],
        [".p1-cap4", 7.9, 10.0],
        [".p1-cap5", 10.4, 12.9],
        [".p1-cap6", 13.3, 16.4],
        [".p1-cap7", 16.9, 19.6],
      ];
      for (const [sel, tin, tout] of caps) {
        tl.fromTo(sel, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, tin);
        tl.to(sel, { opacity: 0, y: -14, duration: 0.22, ease: "power2.in" }, tout);
      }
      // endcard
      tl.fromTo(".p1-dim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 20.1);
      tl.fromTo(".p1-endline1a", { opacity: 0, y: 24, scale: 1.1 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power4.out" }, 20.5);
      tl.fromTo(".p1-endline1b", { opacity: 0, y: 24, scale: 1.1 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power4.out" }, 20.62);
      tl.fromTo(".p1-endline2", { opacity: 0, y: 28, scale: 1.16 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "power4.out" }, 20.9);
      window.__timelines["p1-journey-ja"] = tl;
    </script>
  </body>
</html>
