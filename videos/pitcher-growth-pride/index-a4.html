<!DOCTYPE html>
<html lang="ko">
  <head>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      @font-face {
        font-family: "Pretendard";
        src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Pretendard";
        src: url("assets/fonts/Pretendard-Black.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #070c0a;
        color: #f1f4ee;
        font-family: "Pretendard", sans-serif;
        container-type: size;
      }
      .a4-viewport { position: absolute; inset: 0; overflow: hidden; }
      .a4-zoom { position: absolute; inset: 0; will-change: transform; }
      .a4-zoom video { width: 1080px; height: 1920px; display: block; }
      .a4-scrim { position: absolute; left: 0; top: 0; right: 0; height: 560px; background: linear-gradient(180deg, rgba(4, 8, 6, 0.94) 0%, rgba(4, 8, 6, 0.6) 55%, rgba(4, 8, 6, 0) 100%); }
      .a4-veil { position: absolute; left: 0; right: 0; top: 900px; height: 560px; background: radial-gradient(ellipse 70% 58% at 50% 50%, rgba(4, 8, 6, 0.66) 0%, rgba(4, 8, 6, 0) 74%); opacity: 0; }
      .a4-dim { position: absolute; inset: 0; background: rgba(4, 8, 6, 0.68); opacity: 0; }
      .a4-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
      .a4-chip { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); margin: 0; background: #e8b24c; color: #111111; font-size: 38px; font-weight: 800; letter-spacing: 0.02em; padding: 15px 28px; white-space: nowrap; opacity: 0; }
      .a4-hero { position: absolute; left: 60px; right: 60px; top: 1052px; margin: 0; text-align: center; font-size: 148px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; color: #e8b24c; text-shadow: 0 4px 28px rgba(0, 0, 0, 0.55); opacity: 0; }
      .a4-sub { position: absolute; left: 60px; right: 60px; top: 1228px; margin: 0; text-align: center; font-size: 52px; font-weight: 900; letter-spacing: -0.01em; color: #f1f4ee; text-shadow: 0 4px 22px rgba(0, 0, 0, 0.5); opacity: 0; }
      .a4-endchip { position: absolute; left: 50%; top: 620px; transform: translateX(-50%); margin: 0; background: #e8b24c; color: #111111; font-size: 42px; font-weight: 800; letter-spacing: 0.02em; padding: 18px 34px; white-space: nowrap; opacity: 0; }
      .a4-endline1 { position: absolute; left: 60px; right: 60px; top: 780px; margin: 0; text-align: center; font-size: 92px; line-height: 1.1; font-weight: 900; letter-spacing: -0.03em; color: #f1f4ee; opacity: 0; }
      .a4-endline2 { position: absolute; left: 60px; right: 60px; top: 1020px; margin: 0; text-align: center; font-size: 122px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; color: #e8b24c; opacity: 0; }
    </style>

  <body>

        <div class="a4-scrim"></div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // seg1: strike (0-1.8) — 배지 0.85

      tl.to(".a4-flash", { opacity: 0, duration: 0.2, ease: "power2.out" }, 0.9);

      tl.to(".a4-chip", { opacity: 0, duration: 0.2, ease: "power2.in" }, 6.85);

      tl.fromTo(".a4-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 5.62);
      tl.to(".a4-hero", { opacity: 0, duration: 0.2, ease: "power2.in" }, 6.85);
      tl.to(".a4-veil", { opacity: 0, duration: 0.2, ease: "power2.in" }, 6.85);
      tl.to(".a4-sub", { opacity: 0, duration: 0.2, ease: "power2.in" }, 6.85);
      // endcard
      tl.fromTo(".a4-dim", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 7.1);
      tl.fromTo(".a4-endchip", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 7.3);

      window.__timelines["a4-geulk"] = tl;
