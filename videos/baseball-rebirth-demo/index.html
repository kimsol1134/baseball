    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-last-pitch", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "power3.in" }, 7);
        tl.fromTo("#el-02-memory-game", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 7);
        tl.to("#el-02-memory-game", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-03-read-choose-release", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 15);
        tl.to("#el-03-read-choose-release", { scaleX: 0, transformOrigin: "left center", duration: 0.45, ease: "power3.inOut" }, 27);
        tl.fromTo("#el-04-failure", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.45, ease: "power3.inOut" }, 27);
        tl.to("#el-04-failure", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 36);
        tl.fromTo("#el-05-inherit-memory", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 36);
        tl.to("#el-05-inherit-memory", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "power3.in" }, 47);
        tl.fromTo("#el-06-adaptation", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 47);
        tl.to("#el-06-adaptation", { x: -1920, duration: 0.45, ease: "power3.inOut" }, 60);
        tl.fromTo("#el-07-strikeout", { x: 1920, opacity: 1 }, { x: 0, duration: 0.45, ease: "power3.inOut" }, 60);
        tl.to("#el-07-strikeout", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.55, ease: "power2.inOut" }, 72);
        tl.fromTo("#el-08-drafted", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.55, ease: "power2.inOut" }, 72);
