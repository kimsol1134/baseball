  <div id="root" data-composition-id="02-memory-game" data-width="1920" data-height="1080" data-duration="8.4">

    >
      <div id="02-memory-game-intro-world">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const introWorld = byId("02-memory-game-intro-world");
      const sceneOne = byId("02-memory-game-scene-1");
      const sceneTwo = byId("02-memory-game-scene-2");
      const sceneThree = byId("02-memory-game-scene-3");
      const ruleOne = byId("02-memory-game-rule-one");
      const inheritLabel = byId("02-memory-game-inherit-label");
      const accent = byId("02-memory-game-rule-two-accent");
      const kicker = byId("02-memory-game-kicker");
      const kickerPath = byId("02-memory-game-kicker-path");

      const drawLength = kickerPath.getTotalLength();
      kickerPath.style.strokeDasharray = `${drawLength}`;
      kickerPath.style.strokeDashoffset = `${drawLength}`;

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-memory-game"] = tl;

      tl.fromTo(
        introWorld,
        { opacity: 0, scale: 1.015 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        0,
      );

      tl.fromTo(
        kicker,
        { opacity: 0, y: 9 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        1.28,
      );
      tl.to(
        kickerPath,
        { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
        1.42,
      );

      const focusLayers = [
        { el: byId("02-memory-game-key-art"), blur: "12px", opacity: 0.12 },
        { el: byId("02-memory-game-intro-dim"), blur: "7px", opacity: 0.22 },
        { el: byId("02-memory-game-title-focus"), blur: "9px", opacity: 0.18 },
        { el: byId("02-memory-game-dossier-focus"), blur: "9px", opacity: 0.18 },
      ];

      focusLayers.forEach(({ el, blur, opacity }) => {
        tl.to(
          el,
          {
            "--dof": blur,
            opacity,
            duration: 0.48,
            ease: "power2.inOut",
          },
          2.2,
        );
      });

      tl.to(
        sceneOne,
        { opacity: 0, scale: 0.975, duration: 0.42, ease: "power2.in" },
        2.2,
      );
      tl.fromTo(
        sceneTwo,
        { opacity: 0, scale: 0.985 },
        { opacity: 1, scale: 1, duration: 0.56, ease: "back.out(1.4)" },
        2.22,
      );
      tl.fromTo(
        ruleOne,
        { opacity: 0, scale: 0.97, y: 18 },
        { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "back.out(1.4)" },
        2.32,
      );

      tl.set(sceneTwo, { opacity: 0 }, 4.7);
      tl.set(sceneThree, { opacity: 1 }, 4.7);

      const accentStates = [
        { t: 0, active: false },
        { t: 5.8, active: true },
      ];
      const accentStateAt = (time) => {
        for (let i = accentStates.length - 1; i >= 0; i -= 1) {
          if (time >= accentStates[i].t) return accentStates[i];
        }
        return accentStates[0];
      };
      const accentDriver = { t: 0 };
      tl.to(
        accentDriver,
        {
          t: 8,
          duration: 8,
          ease: "none",
          onUpdate: () => {
            const state = accentStateAt(accentDriver.t);
            accent.style.color = state.active ? "#C8F24A" : "#070A09";
          },
        },
        0,
      );

      tl.fromTo(
        inheritLabel,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" },
        5.92,
      );
    })();
  </script>
