  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const composition = document.querySelector('[data-composition-id="05-inherit-memory"]');
      if (!composition || typeof gsap === "undefined") return;

      const query = (selector) => composition.querySelector(selector);
      const queryAll = (selector) => Array.from(composition.querySelectorAll(selector));
      const choiceStage = query(".f05-inherit-memory-choice-stage");
      const selectedStage = query(".f05-inherit-memory-selected-stage");
      const cards = queryAll(".f05-inherit-memory-card");
      const slots = queryAll(".f05-inherit-memory-slot");

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        query(".f05-inherit-memory-ground-image"),
        { scale: 1.01, x: 0, y: 0 },
        { scale: 1.045, x: -18, y: -8, duration: 6.2, ease: "power1.inOut" },
        2.2,
      );

      tl.fromTo(
        query(".f05-inherit-memory-kicker"),
        { x: -28, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        0,
      );

      tl.fromTo(
        query(".f05-inherit-memory-header-rule"),
        { scaleX: 0, opacity: 0.2 },
        { scaleX: 1, opacity: 1, duration: 1.35, ease: "power3.out" },
        0.12,
      );

      slots.forEach((slot, index) => {
        tl.fromTo(
          slot,
          { scaleX: 0.72, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.72, ease: "power2.out" },
          0.26 + index * 0.08,
        );
      });

      const entries = [
        { at: 0.28, effectAt: 1.32, markerAt: 1.02 },
        { at: 3.1, effectAt: 3.86, markerAt: 3.5 },
        { at: 4.5, effectAt: 5.18, markerAt: 4.88 },
      ];

      cards.forEach((card, index) => {
        const targetX = Number(card.dataset.targetX);
        const targetY = Number(card.dataset.targetY);
        const startProgress = 0.32;
        const mediaMask = card.querySelector(".f05-inherit-memory-effect-mask");
        const marker = card.querySelector(".f05-inherit-memory-marker");

        tl.fromTo(
          card,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * startProgress,
            y: targetY * startProgress,
            scale: 0.72,
            opacity: 0,
          },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 0.76,
            duration: index === 0 ? 1.05 : 0.94,
            ease: "power3.out",
          },
          entries[index].at,
        );

        tl.fromTo(
          mediaMask,
          { scaleX: 1 },
          { scaleX: 0, duration: 0.54, ease: "power2.out" },
          entries[index].effectAt,
        );

        tl.fromTo(
          marker,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          entries[index].markerAt,
        );
      });

      tl.to(
        cards[0],
        { x: 385, y: 24, scale: 1.55, opacity: 1, duration: 0.76, ease: "power3.inOut" },
        5.8,
      );
      tl.to(
        cards[1],
        { x: -500, y: 44, scale: 0.7, opacity: 0.24, duration: 0.72, ease: "power3.inOut" },
        5.8,
      );
      tl.to(
        cards[2],
        { x: -250, y: 44, scale: 0.7, opacity: 0.12, duration: 0.72, ease: "power3.inOut" },
        5.8,
      );
      tl.to(
        cards[0].querySelector("svg"),
        { filter: "brightness(2.5) contrast(1.12)", duration: 0.58, ease: "power2.out" },
        5.82,
      );
      tl.to(
        query(".f05-inherit-memory-focus-line"),
        { opacity: 1, duration: 0.42, ease: "power2.out" },
        6.08,
      );

      const stateSequence = [
        { t: 0, state: "choice" },
        { t: 6.7, state: "selected" },
      ];

      const stateAt = (time) => {
        for (let index = stateSequence.length - 1; index >= 0; index -= 1) {
          if (time >= stateSequence[index].t) return stateSequence[index].state;
        }
        return stateSequence[0].state;
      };

      let lastState = "";
      const applyState = (state) => {
        if (state === lastState) return;
        choiceStage.style.visibility = state === "choice" ? "visible" : "hidden";
        selectedStage.style.visibility = state === "selected" ? "visible" : "hidden";
        lastState = state;
      };

      applyState("choice");
      const stateDriver = { t: 0 };
      tl.to(
        stateDriver,
        {
          t: 11,
          duration: 11,
          ease: "none",
          onUpdate: () => applyState(stateAt(stateDriver.t)),
        },
        0,
      );

      tl.fromTo(
        query(".f05-inherit-memory-closing-lead"),
        { x: -42, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        8.4,
      );

      const closingWords = queryAll(".f05-inherit-memory-closing-word");
      const wordContent = closingWords.map((element) => element.textContent.trim());
      let cumulative = 0;
      const wordSchedule = wordContent.map((word) => {
        const start = cumulative;
        cumulative += 0.14 + word.length * 0.022;
        return { word, start };
      });

      closingWords.forEach((word, index) => {
        tl.fromTo(
          word,
          { x: -54, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
          9.3 + wordSchedule[index].start,
        );
      });

      tl.fromTo(
        query(".f05-inherit-memory-closing-rule"),
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.58, ease: "power3.out" },
        9.42,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["05-inherit-memory"] = tl;
    })();
  </script>
