      if (!root || typeof gsap === "undefined") return;

      const byId = (id) => document.getElementById(id);
      const state07 = byId("06-adaptation-state-07");
      const state08 = byId("06-adaptation-state-08");
      const state09 = byId("06-adaptation-state-09");
      const finalState = byId("06-adaptation-final");

      const focusMemory = byId("06-adaptation-focus-memory");
      const focusCourse = byId("06-adaptation-focus-course");
      const sliderTarget = byId("06-adaptation-target-slider");
      const courseTarget = byId("06-adaptation-target-course");
      const connector = byId("06-adaptation-connector");
      const connectorPath = byId("06-adaptation-connector-path");
      const cursor = byId("06-adaptation-cursor");
      const resultCrop = byId("06-adaptation-result-crop");
      const countCrop = byId("06-adaptation-count-crop");

        byId("06-adaptation-ripple-slider-1"),
        byId("06-adaptation-ripple-slider-2"),
      ];
      const courseRipples = [
        byId("06-adaptation-ripple-course-1"),
        byId("06-adaptation-ripple-course-2"),
      ];

      const connectorLength = connectorPath.getTotalLength();
      connectorPath.style.strokeDasharray = `${connectorLength}`;
      connectorPath.style.strokeDashoffset = `${connectorLength}`;
      gsap.set([...sliderRipples, ...courseRipples], { opacity: 0, scale: 0 });

      const cam = { scale: 1, x: 0, y: 0 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera();

      const sceneRect = scene.getBoundingClientRect();
      const courseRect = courseTarget.getBoundingClientRect();
      const courseOffsetX = courseRect.left + courseRect.width / 2 - (sceneRect.left + sceneRect.width / 2);
      const courseOffsetY = courseRect.top + courseRect.height / 2 - (sceneRect.top + sceneRect.height / 2);
      const focusScale = 1.08;
      const focusX = -courseOffsetX * focusScale;
      const focusY = -courseOffsetY * focusScale;

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["06-adaptation"] = tl;

      tl.fromTo(
        state07,
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        readCrop,
        { opacity: 0, x: -42 },
        { opacity: 1, x: 0, duration: 0.58, ease: "power3.out" },
        0.12,

      tl.fromTo(
        lifeTag,
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.38, ease: "power2.out" },
        0.25,

      tl.fromTo(
        focusMemory,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.48, ease: "power2.out", transformOrigin: "left center" },
        0.52,
      );
      tl.fromTo(
        cursor,
        { opacity: 0, x: 188, y: 470 },
        { opacity: 1, x: 188, y: 486, duration: 0.42, ease: "power2.out" },
        0.48,
