  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const byId = (suffix) => document.getElementById(`07-strikeout-${suffix}`);

      const stateOne = byId("state-one");
      const stateCounter = byId("state-counter");
      const stateFinal = byId("state-final");
      const labelOne = byId("label-one");
      const labelCounter = byId("label-counter");
      const resultPanel = byId("result-panel");
      const resultCrop = byId("result-crop");
      const memory = byId("memory");
      const strategy = byId("strategy");
      const acidRule = byId("acid-rule");
      const outStamp = byId("out-stamp");
      const cornerResult = byId("corner-result");
      const glyphs = Array.from(strategy.querySelectorAll("span"));

      const tl = gsap.timeline({ paused: true });

      tl.set(stateOne, { opacity: 1, scale: 1, x: 0, y: 0 }, 0);
      tl.set([stateCounter, stateFinal], { opacity: 0, scale: 0.74, x: 0, y: 0 }, 0);
      tl.set([labelOne, labelCounter, resultPanel, resultCrop, memory, outStamp, cornerResult], { opacity: 0 }, 0);
      tl.set(glyphs, { opacity: 0, y: "3.3cqh" }, 0);
      tl.set(acidRule, { opacity: 1, scaleX: 0 }, 0);

      tl.fromTo(
        labelOne,
        { opacity: 0, y: "-1.7cqh" },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        0.18,
      );

      tl.to(stateOne, { opacity: 0, scale: 0.74, duration: 0.4, ease: "power2.in" }, 1.2);
      tl.to(labelOne, { opacity: 0, y: "-1.2cqh", duration: 0.24, ease: "power2.in" }, 1.2);
      tl.fromTo(
        stateCounter,
        { opacity: 0, scale: 0.74 },
        { opacity: 1, scale: 1, duration: 0.58, ease: "back.out(1.8)" },
        1.44,
      );
      tl.fromTo(
        labelCounter,
        { opacity: 0, y: "1.7cqh" },
        { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
        1.62,
      );

      tl.to(labelCounter, { opacity: 0, y: "-1.2cqh", duration: 0.22, ease: "power2.in" }, 2.92);
      tl.to(stateCounter, { opacity: 0, scale: 0.74, duration: 0.38, ease: "power2.in" }, 3.0);
      tl.fromTo(
        stateFinal,
        { opacity: 0, scale: 0.74, x: 0, y: 0 },
        { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.58, ease: "back.out(1.8)" },
        3.18,
      );

      tl.to(
        stateFinal,
        {
          x: "-15.5cqw",
          y: "-1.1cqh",
          scale: 0.58,
          duration: 0.82,
          ease: "power3.inOut",
        },
        4.4,
      );
      tl.fromTo(
        resultPanel,
        { opacity: 0, scale: 0.74, x: "-29cqw" },
        { opacity: 1, scale: 1, x: 0, duration: 0.64, ease: "back.out(1.8)" },
        4.49,
      );
      tl.fromTo(
        resultCrop,
        { opacity: 0, y: "2.3cqh" },
        { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
        5.2,
      );

      tl.to(
        stateFinal,
        { opacity: 0, x: "-45cqw", duration: 0.34, ease: "power4.in" },
        6.2,
      );
      tl.to(
        resultPanel,
        { opacity: 0, x: "31cqw", duration: 0.34, ease: "power4.in" },
        6.2,
      );
      tl.fromTo(
        memory,
        { opacity: 0, y: "3.2cqh" },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
        6.52,
      );

      const BASE_DURATION = 0.035;
      const SEC_PER_CHAR = 0.055;
      let cumulative = 0;
      const CHARACTER_SEQUENCE = glyphs.map((node) => {
        const body = node.textContent;
        const hold = body.trim().length === 0 ? 0 : 0.035;
        const duration = BASE_DURATION + Array.from(body).length * SEC_PER_CHAR + hold;
        const start = cumulative;
        cumulative += duration;
        return { node, start, end: cumulative };
      });

      CHARACTER_SEQUENCE.forEach(({ node, start }) => {
        tl.fromTo(
          node,
          { opacity: 0, y: "3.3cqh" },
          { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" },
          7.6 + start,
        );
      });

      tl.fromTo(
        acidRule,
        { opacity: 1, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.3, ease: "power4.out" },
        9.3,
      );
      tl.fromTo(
        cornerResult,
        { opacity: 0, x: "1.8cqw", y: "-1.4cqh" },
        { opacity: 1, x: 0, y: 0, duration: 0.38, ease: "power3.out" },
        9.72,
      );
      tl.fromTo(
        outStamp,
        { opacity: 0, y: "1.5cqh" },
        { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
        10.2,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["07-strikeout"] = tl;
    })();
  </script>
