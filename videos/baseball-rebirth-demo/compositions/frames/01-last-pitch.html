  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "01-last-pitch";
      const root = document.querySelector('[data-composition-id="' + compositionId + '"]');
      const outer = document.getElementById("01-last-pitch-zoom-outer");
      const inner = document.getElementById("01-last-pitch-zoom-inner");
      const target = document.getElementById("01-last-pitch-release-target");
      const focusPlane = document.getElementById("01-last-pitch-focus-plane");
      const depthImage = document.getElementById("01-last-pitch-depth-image");
      const needle = document.getElementById("01-last-pitch-release-needle");
      const needleEcho = document.getElementById("01-last-pitch-release-needle-echo");
      const kickerRule = document.getElementById("01-last-pitch-kicker-rule");
      const kickerCopy = document.getElementById("01-last-pitch-kicker-copy");
      const statementPrimary = document.getElementById("01-last-pitch-statement-primary");
      const wordHan = document.getElementById("01-last-pitch-word-han");
      const wordSaengeul = document.getElementById("01-last-pitch-word-saengeul");
      const wordBakkunda = document.getElementById("01-last-pitch-word-bakkunda");

      const rootRect = root.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const rootScaleX = rootRect.width > 0 ? 1920 / rootRect.width : 1;
      const rootScaleY = rootRect.height > 0 ? 1080 / rootRect.height : 1;
      const targetWidth = targetRect.width * rootScaleX;
      const targetHeight = targetRect.height * rootScaleY;
      const targetOffsetX =
        (targetRect.left + targetRect.width / 2 - (rootRect.left + rootRect.width / 2)) *
        rootScaleX;
      const targetOffsetY =
        (targetRect.top + targetRect.height / 2 - (rootRect.top + rootRect.height / 2)) *
        rootScaleY;
      const maxOpeningScale = Math.min(
        (0.88 * 1920) / targetWidth,
        (0.88 * 1080) / targetHeight,
      );
      const openingScale = Math.min(6.25, maxOpeningScale);

      const camera = {
        scale: openingScale,
        x: -targetOffsetX,
        y: -targetOffsetY,
      };

      const applyCamera = () => {
        gsap.set(outer, { scale: camera.scale });
        gsap.set(inner, { x: camera.x, y: camera.y });
      };
      applyCamera();

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      tl.fromTo(
        depthImage,
        { "--dof": "12px", scale: 1.06, opacity: 0.7 },
        {
          "--dof": "4px",
          scale: 1,
          opacity: 1,
          duration: 1.45,
          ease: "power2.inOut",
          immediateRender: true,
        },
        0,
      );

      tl.fromTo(
        focusPlane,
        { "--dof": "10px", opacity: 0.76 },
        {
          "--dof": "0px",
          opacity: 1,
          duration: 1.35,
          ease: "power2.inOut",
          immediateRender: true,
        },
        0,
      );

      tl.fromTo(
        needleEcho,
        { scaleY: 0.55, opacity: 0.2 },
        {
          scaleY: 1.7,
          opacity: 0.72,
          duration: 0.16,
          ease: "power2.out",
          immediateRender: true,
        },
        0.34,
      );
      tl.to(
        needleEcho,
        { scaleY: 1, opacity: 0.38, duration: 0.2, ease: "power2.inOut" },
        0.5,
      );
      tl.fromTo(
        needle,
        { scaleY: 0.68, opacity: 0.65 },
        {
          scaleY: 1.2,
          opacity: 1,
          duration: 0.13,
          ease: "power3.out",
          immediateRender: true,
        },
        0.78,
      );
      tl.to(needle, { scaleY: 1, duration: 0.18, ease: "power2.out" }, 0.91);

      tl.fromTo(
        camera,
        {
          scale: openingScale,
          x: -targetOffsetX,
          y: -targetOffsetY,
        },
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 3.2,
          ease: "power4.out",
          onUpdate: applyCamera,
          immediateRender: true,
        },
        1.7,
      );

      tl.fromTo(
        kickerRule,
        { scaleX: 0, opacity: 0 },
        {
          scaleX: 1,
          opacity: 1,
          duration: 0.42,
          ease: "power3.out",
          immediateRender: true,
        },
        3.14,
      );
      tl.fromTo(
        kickerCopy,
        { x: -24, opacity: 0 },
        {
          x: 0,
          opacity: 1,
          duration: 0.38,
          ease: "power3.out",
          immediateRender: true,
        },
        3.2,
      );

      tl.fromTo(
        statementPrimary,
        { x: -38, opacity: 0, filter: "blur(8px)" },
        {
          x: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.32,
          ease: "power3.out",
          immediateRender: true,
        },
        4.9,
      );

      const wordContent = [
        { element: wordHan, body: "한" },
        { element: wordSaengeul, body: "생을" },
        { element: wordBakkunda, body: "바꾼다" },
      ];
      const baseDuration = 0.08;
      const secondsPerCharacter = 0.025;
      let cumulative = 0;
      const wordTimeline = wordContent.map((entry) => {
        const duration = baseDuration + Array.from(entry.body).length * secondsPerCharacter;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });

      wordTimeline.forEach((entry) => {
        tl.fromTo(
          entry.element,
          { x: -42, opacity: 0, filter: "blur(9px)" },
          {
            x: 0,
            opacity: 1,
            filter: "blur(0px)",
            duration: 0.22,
            ease: "power3.out",
            immediateRender: true,
          },
          5.18 + entry.start,
        );
      });
    })();
  </script>
