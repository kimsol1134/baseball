  <div id="root" data-composition-id="04-failure" data-width="1920" data-height="1080" data-duration="9.5">

    >

        id="04-failure-result-image"

    <section
      id="04-failure-gameover-scene"
      class="clip"
      data-start="4.7"

    >
      <img
        id="04-failure-legacy-image"
        src="assets/scene-legacy.webp"
        alt="오래된 야구공과 기억을 돌아보는 선수"
      />

      <div id="04-failure-game-surface">
        <img
          id="04-failure-memory-image"
          src="assets/game-05-memory-choice.png"
          alt="이번 생 종료 후 하나의 기억을 고르는 실제 게임 화면"
        />

      <svg width="0" height="0" aria-hidden="true" style="position: absolute">
        <filter id="04-failure-streak-filter" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="04-failure"]');
      const byId = (id) => document.getElementById(id);

      const resultScene = byId("04-failure-result-scene");
      const resultImage = byId("04-failure-result-image");
      const resultPhrase = byId("04-failure-result-phrase");
      const resultHairline = byId("04-failure-result-hairline");
      const beatEnding = byId("04-failure-beat-ending");
      const beatHit = byId("04-failure-beat-hit");
      const gameoverScene = byId("04-failure-gameover-scene");
      const lifeLine = byId("04-failure-life-line");
      const finalLine = byId("04-failure-final-line");
      const surfaceDarkener = byId("04-failure-surface-darkener");
      const blurNode = byId("04-failure-streak-blur");
      const chunks = Array.from(root.querySelectorAll("[data-04-failure-chunk]"));

      const tl = gsap.timeline({ paused: true });

      tl.set(chunks, { opacity: 0 }, 0);
      tl.set(resultHairline, { opacity: 0, scaleX: 0 }, 0);
      tl.set([beatEnding, beatHit, lifeLine, finalLine], { opacity: 0 }, 0);

      const CONTENT = chunks.map((element) => ({
        element,
        body: element.textContent.trim(),
      }));
      const BASE_DURATION = 0.12;
      const SEC_PER_CHAR = 0.045;
      let cumulative = 0;
      const CHUNK_TIMELINE = CONTENT.map((entry) => {
        const duration = BASE_DURATION + entry.body.length * SEC_PER_CHAR;
        const start = 1 + cumulative;
        cumulative += duration;
        return { ...entry, start, end: 1 + cumulative };
      });

      tl.fromTo(
        resultHairline,
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.64, ease: "power4.out" },
        1,
      );

      CHUNK_TIMELINE.forEach((entry) => {
        tl.fromTo(
          entry.element,
          { yPercent: 118, opacity: 0 },
          {
            yPercent: 0,
            opacity: 1,
            duration: 0.34,
            ease: "power4.out",
            immediateRender: false,
          },
          entry.start,
        );
      });

      tl.set([resultPhrase, resultHairline], { opacity: 0 }, 2.4);
      tl.to(resultImage, { opacity: 0.5, duration: 0.25, ease: "power2.out" }, 2.4);

      const PULSE = 0.3;
      const BEAT_ORIGIN = 2.5;
      const BEATS = [BEAT_ORIGIN, BEAT_ORIGIN + PULSE * 4];

      tl.fromTo(
        beatEnding,
        { x: -140, scale: 1.5, filter: "blur(16px)", opacity: 0 },
        {
          x: 0,
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.5,
          ease: "power4.out",
          immediateRender: false,
        },
        BEATS[0],
      );

      tl.set(beatEnding, { opacity: 0 }, BEATS[1]);
      tl.set(beatHit, { opacity: 1 }, BEATS[1]);
      tl.fromTo(
        beatHit,
        { x: 420 },
        { x: 0, duration: 0.45, ease: "expo.out", immediateRender: false },
        BEATS[1],
      );

      tl.to(resultScene, { y: 230, duration: 0.3, ease: "power4.in" }, 4.4);
      tl.to(resultScene, { opacity: 0, duration: 0.18, ease: "power1.in" }, 4.52);
      tl.fromTo(
        gameoverScene,
        { y: -230, opacity: 0.35 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" },
        4.7,
      );

      tl.fromTo(
        lifeLine,
        { yPercent: 118, opacity: 0 },
        {
          yPercent: 0,
          opacity: 1,
          duration: 0.52,
          ease: "power4.out",
          immediateRender: false,
        },
        5.05,
      );

      tl.to(surfaceDarkener, { opacity: 0.28, duration: 0.38, ease: "power2.out" }, 6.8);

      const blurProxy = { value: 24 };
      const writeBlur = () => {
        blurNode.setAttribute("stdDeviation", `${blurProxy.value} 0`);
      };
      writeBlur();

      tl.fromTo(
        finalLine,
        { x: -650, opacity: 0 },
        {
          x: 0,
          opacity: 1,
          duration: 0.52,
          ease: "power4.out",
          immediateRender: false,
        },
        7.2,
      );
      tl.to(
        blurProxy,
        {
          value: 0,
          duration: 0.52,
          ease: "power4.out",
          onUpdate: writeBlur,
        },
        7.2,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-failure"] = tl;
    })();
  </script>
