  <script>
    (() => {
      const composition = document.querySelector('[data-composition-id="03-read-choose-release"]');
      const game02 = document.getElementById("03-read-choose-release-game02");
      const game03 = document.getElementById("03-read-choose-release-game03");
      const focus = document.getElementById("03-read-choose-release-focus-box");
      const cursor = document.getElementById("03-read-choose-release-cursor");
      const route = document.getElementById("03-read-choose-release-route-path");
      const finalDim = document.getElementById("03-read-choose-release-final-dim");
      const meterCrop = document.getElementById("03-read-choose-release-meter-crop");
      const meterTrack = document.getElementById("03-read-choose-release-meter-track");
      const meterFill = document.getElementById("03-read-choose-release-meter-fill");
      const meterNeedle = document.getElementById("03-read-choose-release-meter-needle");
      const counterRead = document.getElementById("03-read-choose-release-counterread");
      const steps = Array.from(
        composition.querySelectorAll('[class~="03-read-choose-release-step"]'),
      );
      const rings = Array.from(
        composition.querySelectorAll('[class~="03-read-choose-release-ripple-ring"]'),
      );
      const routeLength = route.getTotalLength();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["03-read-choose-release"] = tl;

      tl.set(game03, { opacity: 0, scale: 0.985 }, 0);
      tl.set(steps, { opacity: 0, y: 0 }, 0);
      tl.set(counterRead, { opacity: 0, y: 0 }, 0);
      tl.set(rings, { opacity: 0, scale: 0 }, 0);
      tl.set(route, {
        opacity: 0,
        strokeDasharray: routeLength,
        strokeDashoffset: routeLength,
      }, 0);
      tl.set(finalDim, { opacity: 0 }, 0);
      tl.set(meterCrop, { opacity: 0 }, 0);
      tl.set(meterTrack, { opacity: 0 }, 0);
      tl.set(meterFill, { scaleX: 0 }, 0);
      tl.set(meterNeedle, { opacity: 0 }, 0);
      tl.set(cursor, { x: 956, y: 420, opacity: 0, scale: 1 }, 0);
      tl.set(focus, {
        left: 198,
        top: 321,
        width: 291,
        height: 180,
        opacity: 0,
        scale: 1,
      }, 0);

      tl.fromTo(
        game02,
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        cursor,
        { opacity: 0 },
        { opacity: 1, duration: 0.24, ease: "power2.out" },
        0.28,
      );
      tl.fromTo(
        focus,
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power2.out" },
        0.42,
      );

      const click = (site, at) => {
        const siteRings = Array.from(
          composition.querySelectorAll(
            `[data-ripple-site="${site}"] [class~="03-read-choose-release-ripple-ring"]`,
          ),
        );

        tl.to(cursor, { scale: 0.86, duration: 0.08, ease: "power2.in" }, at);
        tl.to(focus, { scale: 0.96, duration: 0.08, ease: "power2.in" }, at);
        tl.to(cursor, { scale: 1, duration: 0.09, ease: "power2.out" }, at + 0.08);
        tl.to(focus, { scale: 1, duration: 0.09, ease: "power2.out" }, at + 0.08);
        tl.fromTo(
          siteRings,
          { opacity: 0.8, scale: 0.2 },
          {
            opacity: 0,
            scale: 3.2,
            duration: 0.64,
            ease: "power3.out",
            stagger: 0.08,
            immediateRender: false,
          },
          at,
        );
      };

      const FOCUS_BASE_DURATION = 0.7;
      const FOCUS_SEC_PER_CHAR = 0.05;
      const focusContent = [
        { key: "read", body: "READ", hold: 1.4, left: 198, top: 321, width: 291, height: 180 },
        { key: "pitch", body: "PITCH", hold: 1.85, left: 1474, top: 256, width: 120, height: 72 },
        { key: "zone", body: "ZONE", hold: 1.9, left: 1562, top: 492, width: 52, height: 54 },
        {
          key: "release",
          body: "HOLD RELEASE",
          hold: 2.8,
          left: 1347,
          top: 642,
          width: 373,
          height: 59,
        },
      ];
      let focusCumulative = 0;
      const focusTimeline = focusContent.map((entry) => {
        const duration =
          FOCUS_BASE_DURATION + entry.body.length * FOCUS_SEC_PER_CHAR + entry.hold;
        const start = focusCumulative;
        focusCumulative += duration;
        return { ...entry, start, end: focusCumulative };
      });
      const focusAt = (time) => {
        for (let index = focusTimeline.length - 1; index >= 0; index -= 1) {
          if (time >= focusTimeline[index].start) return focusTimeline[index];
        }
        return focusTimeline[0];
      };
      const focusDriver = { time: 0 };
      let lastFocusKey = "read";

      tl.to(
        focusDriver,
        {
          time: focusCumulative,
          duration: focusCumulative,
          ease: "none",
          onUpdate: () => {
            const state = focusAt(focusDriver.time);
            if (state.key !== lastFocusKey) {
              gsap.set(focus, {
                left: state.left,
                top: state.top,
                width: state.width,
                height: state.height,
                scale: 1,
              });
              lastFocusKey = state.key;
            }
          },
        },
        0,
      );

      tl.set(focus, { left: 1346, top: 598, width: 374, height: 34, scale: 1 }, 10);

      const labelSequence = [
        { element: steps[0], reveal: 1.4, clear: 2.3 },
        { element: steps[1], reveal: 3.16, clear: 5.1 },
        { element: steps[2], reveal: 6.55, clear: 7.9 },
        { element: steps[3], reveal: 9.08, clear: 12 },
      ];

      labelSequence.forEach((state) => {
        tl.fromTo(
          state.element,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" },
          state.reveal,
        );
        if (state.clear < 12) {
          tl.set(state.element, { opacity: 0 }, state.clear);
        }
      });

      tl.to(cursor, { x: 340, y: 408, duration: 0.72, ease: "power2.inOut" }, 0.36);
      click("read", 1.12);

      tl.to(cursor, { x: 1530, y: 290, duration: 0.72, ease: "power2.inOut" }, 2.32);
      click("pitch", 3.12);

      tl.set(route, { opacity: 0.72 }, 5.18);
      tl.to(
        route,
        { strokeDashoffset: 0, duration: 1.38, ease: "power2.out" },
        5.18,
      );
      tl.to(cursor, { x: 1584, y: 517, duration: 0.66, ease: "power2.inOut" }, 5.16);
      click("zone", 5.92);
      tl.fromTo(
        counterRead,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" },
        6.82,
      );

      tl.set(counterRead, { opacity: 0 }, 7.9);
      tl.set(route, { opacity: 0 }, 7.9);
      tl.to(cursor, { x: 1530, y: 669, duration: 0.62, ease: "power2.inOut" }, 7.94);
      click("release", 8.66);

      tl.to(
        game02,
        { opacity: 0, scale: 0.985, duration: 0.38, ease: "power2.in" },
        8.76,
      );
      tl.to(
        game03,
        { opacity: 1, scale: 1, duration: 0.58, ease: "back.out(1.4)" },
        8.98,
      );

      tl.to(finalDim, { opacity: 1, duration: 0.28, ease: "power2.out" }, 10);
      tl.to(meterCrop, { opacity: 1, duration: 0.32, ease: "power2.out" }, 10.04);
      tl.set(meterTrack, { opacity: 1 }, 10.08);
      tl.to(
        meterFill,
        { scaleX: 0.54, duration: 0.82, ease: "power2.out" },
        10.1,
      );
      tl.fromTo(
        meterNeedle,
        { opacity: 0 },
        { opacity: 1, duration: 0.16, ease: "power2.out" },
        10.84,
      );
    })();
  </script>
