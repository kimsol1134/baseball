name: P0 CI

on:
  push:
  pull_request:

jobs:
  swift:
    name: Swift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            swift: "6.3.3"
          - os: windows-2022
            swift: "6.3.2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift }}
          check-latest: true
      - name: Test simulation packages
        run: swift test --package-path packages/simulation-core

  ios:
    name: iOS build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      # 생성 결과가 커밋된 프로젝트와 어긋나면 로컬과 CI가 다른 것을 빌드하게 된다.
      - name: Verify the committed project matches project.yml
        run: git diff --exit-code apps/ios/Baseball.xcodeproj/project.pbxproj
      - name: Build and test
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project Baseball.xcodeproj \
            -scheme BaseballIOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skip-testing:BaseballIOSUITests/PromoCaptureUITests \
            -skip-testing:BaseballIOSTests/PromoFrameExportTests \
            -skip-testing:BaseballIOSTests/PromoAudioExportTests \
            test CODE_SIGNING_ALLOWED=NO
      # 릴리스 구성에서도 앱이 만들어져야 한다. 유료앱 권한 게이트 회귀를 잡는 마지막 그물이다.
      - name: Release configuration build
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project Baseball.xcodeproj \
            -scheme BaseballIOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            build CODE_SIGNING_ALLOWED=NO

  web:
    name: React tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: "6.3.3"
          check-latest: true
      - run: npm ci
      - run: npm run check:design-system
      - run: npm run check:copy
      - run: npm run check:dialogue-parity
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run check:web-assets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run steam:submission:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-ui-report
          path: |
            apps/windows/playwright-report
            apps/windows/test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            swift: "6.3.3"
            bundles: app
            artifact: apps/windows/src-tauri/target/release/bundle/macos/*.app
          - name: Windows x64
            os: windows-2022
            swift: "6.3.2"
            bundles: nsis
            artifact: apps/windows/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift }}
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run prepare:sidecar
      - run: npm run test:tauri
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - run: npm run smoke:sidecar
      - name: Verify installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/smoke-windows-install.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: baseball-${{ runner.os }}-ci
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
