name: P0 CI

on:
  push:
  pull_request:

jobs:
  swift:
    name: Swift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            swift: "6.3.3"
          - os: windows-2022
            swift: "6.3.2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift }}
          check-latest: true
      - name: Test simulation packages
        run: swift test --package-path packages/simulation-core

  web:
    name: React tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run steam:submission:check

  desktop:
    name: Desktop package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            swift: "6.3.3"
            bundles: app
            artifact: apps/windows/src-tauri/target/release/bundle/macos/*.app
          - name: Windows x64
            os: windows-2022
            swift: "6.3.2"
            bundles: nsis
            artifact: apps/windows/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift }}
          check-latest: true
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run prepare:sidecar
      - run: npm run test:tauri
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - run: npm run smoke:sidecar
      - name: Verify installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/smoke-windows-install.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: baseball-${{ runner.os }}-ci
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
