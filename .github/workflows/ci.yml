name: P0 CI

on:
  push:
  pull_request:

jobs:
  swift:
    name: Swift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@v1.13.0
        with:
          swift-version: "6.3.3"
      - name: Test simulation packages
        run: swift test --package-path packages/simulation-core

  web:
    name: React tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run build:web

  tauri:
    name: Tauri configuration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: SwiftyLab/setup-swift@v1.13.0
        with:
          swift-version: "6.3.3"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run prepare:sidecar
      - run: npm run check:tauri
